# TripSarthi referral PARTNER portal (external partners) - partners.tripsarthi.com, via the shared Docker Caddy (TLS) -> this port.
# Managed from the repo: deploy/nginx-partner-behind-caddy.conf   (install: copy to /etc/nginx/sites-available/tripsarthi-partner,
# symlink into sites-enabled, `nginx -t && systemctl reload nginx`).
#
# Needs, outside this repo (the Caddy container is shared and not ours):
#   1. DNS:   partners.tripsarthi.com  A  103.209.146.108
#   2. Caddy: in /root/medirift/Caddyfile add
#         partners.tripsarthi.com { import common  reverse_proxy host.docker.internal:8096 }     (same pattern as app.tripsarthi.com -> 8093)
#      then reload Caddy. Editing that file needs the box owner's OK.
#
# Only /api/ reaches PHP. No webhooks, hosted forms, embed script or meeting links are served here.
server {
    listen 8096;
    listen [::]:8096;
    server_name _;

    root /var/www/html/tripsarthi/frontend/dist-partner;
    index partner.html;

    client_max_body_size 1m;
    access_log /var/log/nginx/tripsarthi-partner.access.log;
    error_log  /var/log/nginx/tripsarthi-partner.error.log;

    location / { try_files $uri $uri/ /partner.html; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /partner.html { add_header Cache-Control "no-cache"; }

    location ^~ /api/ { try_files $uri @codeigniter; }

    location @codeigniter {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/html/tripsarthi/backend/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/tripsarthi/backend/public;
        fastcgi_read_timeout 120;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

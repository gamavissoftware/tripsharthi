# TripSarthi marketing website (static) - tripsarthi.com, via the shared Docker Caddy (TLS) -> this port.
# Managed from the repo: deploy/nginx-website-behind-caddy.conf
server {
    listen 8094;
    listen [::]:8094;
    server_name www.tripsarthi.com;
    return 301 https://tripsarthi.com$request_uri;   # one canonical host (matches the canonical tags)
}
server {
    listen 8094 default_server;
    listen [::]:8094 default_server;
    server_name _;
    root /var/www/html/tripsarthi/website;
    index index.html;
    access_log /var/log/nginx/tripsarthi-web.access.log;
    error_log  /var/log/nginx/tripsarthi-web.error.log;
    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' https://app.tripsarthi.com; frame-src https://www.google.com; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'self'" always;

    gzip on; gzip_comp_level 6; gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # never serve build tooling, notes or hidden files
    location ~ ^/(build\.py|build_content\.py|_headers|.*\.md)$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }

    location = /index.html { return 301 /; }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    location /assets/fonts/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; }
    location /assets/img/ { expires 30d; add_header Cache-Control "public"; add_header X-Content-Type-Options nosniff always; }
    location ~* ^/assets/(css|js|brand)/ { expires 1y; add_header Cache-Control "public"; add_header X-Content-Type-Options nosniff always; }
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' https://app.tripsarthi.com; frame-src https://www.google.com; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /sitemap.xml { default_type application/xml; add_header Cache-Control "public, max-age=0, must-revalidate"; }
    location = /robots.txt  { default_type text/plain; add_header Cache-Control "public, max-age=0, must-revalidate"; }
    location = /llms.txt    { default_type text/plain; add_header Cache-Control "public, max-age=0, must-revalidate"; }
}
